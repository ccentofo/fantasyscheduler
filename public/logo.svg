<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      /* Background matches Matrix Accent color */
      .bg { fill: #3B82F6; } /* Vibrant Schedule Blue Background (Matched) */
      .primary { stroke: #FFFFFF; fill: #FFFFFF; } /* Crisp White Silhouette */
      .accent { stroke: #3B82F6; fill: #3B82F6; } /* Vibrant Schedule Blue Grid (Disappears on matched background) */
      .heatmap-green { fill: #4ADE80; stroke: none; } /* Extracted Frequency Matrix Green */
    </style>
  </defs>

  <rect class="bg" width="512" height="512" rx="48" />

  <g id="schedule-matrix-logo">
    
    <path d="M 24 256 Q 256 24 488 256 Q 256 488 24 256 Z" 
          fill="none" class="primary" stroke-width="24" 
          stroke-linecap="round" stroke-linejoin="round" />

    <g id="frequency-heatmap-pattern" class="heatmap-green" transform="translate(0, -2)">
      <rect x="200" y="160" width="56" height="48" rx="8" />
      
      <rect x="312" y="208" width="56" height="48" rx="8" />
      
      <rect x="144" y="256" width="56" height="48" rx="8" />
      
      <rect x="256" y="304" width="56" height="48" rx="8" />
    </g>
    
    <g fill="none" class="accent" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      
      <line x1="144" y1="160" x2="144" y2="352" />
      <line x1="200" y1="160" x2="200" y2="352" />
      <line x1="256" y1="160" x2="256" y2="352" stroke-width="24" /> /* Bolder center lace */
      <line x1="312" y1="160" x2="312" y2="352" />
      <line x1="368" y1="160" x2="368" y2="352" />
      
      <line x1="144" y1="160" x2="368" y2="160" />
      <line x1="144" y1="208" x2="368" y2="208" />
      <line x1="144" y1="256" x2="368" y2="256" stroke-width="24" /> /* Bolder center lace */
      <line x1="144" y1="304" x2="368" y2="304" />
      <line x1="144" y1="352" x2="368" y2="352" />
      
    </g>
  </g>

</svg>

